<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>SockRpcV3 · 单文件 sloth_v3_min.js 用法示例</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
    <h1>SockRpcV3 · 单文件加载示例（sloth_v3_min.js）</h1>
    <p>把原先 5 个脚本（tools / slice / ag / fn / sock_rpc_v3）打包成了 <code>sloth_v3_min.js</code>，
       一行 script 搞定，加载顺序和 <code>index_v3.html L17-L21</code> 完全一致。</p>

    <pre id="out"></pre>

    <!--
      ⭐ 一行加载：把原本 5 个 script 合并压缩后加载，顺序完全一致
          · sloth_v3_min.js     生产用（terser 压缩，~36KB）
          · sloth_v3_bundle.js  调试用（未压缩全量，~130KB，带 source 文件分割 banner，便于断点定位）
    -->
    <script src="./sloth_v3_bundle.js"></script>

    <script>
        function log(s) {
            const t = document.getElementById('out');
            const line = (typeof s === 'string' ? s : JSON.stringify(s, null, 2));
            t.textContent += line + '\n';
            console.log(s);
        }

        // 1. 原本的 5 个全局对象都在：SockRpcV3 / ACTION_* / TlvValue / TlvJson
        log('✅ SockRpcV3    global = ' + (typeof SockRpcV3));
        log('✅ TlvJson       global = ' + (typeof TlvJson));
        log('✅ TlvValue      global = ' + (typeof TlvValue));
        log('✅ ACTION_CALL  global = ' + (typeof ACTION_CALL === 'number' ? ACTION_CALL : 'n/a'));

        // 2. 往返验证：TlvJson ↔ TlvValue（和 Go tlv.Json / tlv.Value 对称）
        const payload = { UserId: 42, RoomId: 1, Token: 'tok_min_js', Ts: Math.floor(Date.now()/1000) };
        const b = TlvJson(payload);
        const j = TlvValueAsJson(b);
        log('✅ TlvJson roundtrip equal: ' + (JSON.stringify(j) === JSON.stringify(payload)));

        // 3. 实际连接演示（等价于 index_v3.html 的用法，完全兼容 API）
        const rpc = new SockRpcV3({
            addr: 'ws://localhost:8990/ws',
            timeoutMs: 10000,
            sliceSize: 512,
            autoReconnect: true,
            reconnectDelay: 1000,
            backoffMax: 20000,
        });

        rpc.AddEvent('onreconnecting', info => log(`♻️  onReconnecting #${info.attempts}, next ${info.delayMs}ms (${info.reason})`));
        rpc.OnOpen(() => {
            log('✅ onOpen: WS connected');
            rpc.SetHeader('APP_ID', '1');
            rpc.SetHeader('USER_ID', '1');

            // Bind 本地服务（反向 CALL）
            rpc.Bind('shop', {
                Test: (arg) => {
                    log('👂 shop.Test called, arg=' + JSON.stringify(arg));
                    return 'helo' + Date.now();   // 返回值不包 AG，直接纯字符串
                }
            });

            // Call v1.Sign
            const signPayload = new TextEncoder().encode('sign');
            rpc.Call('v1.Sign', signPayload, (data) => {
                log('✅ v1.Sign reply raw bytes len=' + (data && data.length));
                if (data instanceof Uint8Array) {
                    // 服务端返回 tlv.Json(auth) → 这里剥 TLV 再 JSON.parse
                    try {
                        const auth = TlvValueAsJson(data);
                        log('✅ v1.Sign -> auth = ' + JSON.stringify(auth));
                    } catch (e) {
                        log('⚠️  v1.Sign parse json failed: ' + e.message);
                        log('    raw text = ' + TlvValueAsText(data));
                    }
                }
            }, (err) => {
                log('❌ v1.Sign err: ' + (err && err.message ? err.message : err));
            });
        });
        rpc.OnClose(() => log('⚠️  onClose'));
        rpc.OnError((e) => log('❌ onError: ' + JSON.stringify(e)));

        rpc.Connect();

        // 手动 Reconnect 演示（对应 index_v3.html L109 超时后的 rpc.Reconnect()）
        // setTimeout(() => rpc.Reconnect(), 60_000);
    </script>
</body>
</html>
